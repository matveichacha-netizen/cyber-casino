<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CyberCasino Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        h1 { color: #e94560; margin-bottom: 10px; }
        .balance { font-size: 20px; margin-bottom: 20px; color: #4ecca3; }
        .slots {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: #16213e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
            margin-bottom: 25px;
        }
        .reel {
            width: 70px;
            height: 70px;
            background: #0f3460;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 2px solid #e94560;
        }
        button {
            background: linear-gradient(45deg, #e94560, #0f3460);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        .result { margin-top: 20px; font-size: 18px; min-height: 25px; }
    </style>
</head>
<body>

    <h1>🎰 CYBER CASINO 🎰</h1>
    <div class="balance">Баланс: <span id="balance">1000</span> 🪙</div>

    <div class="slots">
        <div class="reel" id="r1">7️⃣</div>
        <div class="reel" id="r2">7️⃣</div>
        <div class="reel" id="r3">7️⃣</div>
    </div>

    <button onclick="spin()">КРУТИТЬ (-100)</button>
    <div class="result" id="result">Удачи!</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000;
        const symbols = ['🎰', '💎', '7️⃣', '🍒', '🍋', '🔔'];

        function spin() {
            if (balance < 100) {
                document.getElementById('result').innerText = "❌ Недостаточно монет!";
                return;
            }

            balance -= 100;
            document.getElementById('balance').innerText = balance;

            const r1 = symbols[Math.floor(Math.random() * symbols.length)];
            const r2 = symbols[Math.floor(Math.random() * symbols.length)];
            const r3 = symbols[Math.floor(Math.random() * symbols.length)];

            document.getElementById('r1').innerText = r1;
            document.getElementById('r2').innerText = r2;
            document.getElementById('r3').innerText = r3;

            if (r1 === r2 && r2 === r3) {
                balance += 500;
                document.getElementById('result').innerText = "🎉 ДЖЕКПОТ! +500 🪙";
                document.getElementById('balance').innerText = balance;
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                balance += 150;
                document.getElementById('result').innerText = "✨ Выигрыш! +150 🪙";
                document.getElementById('balance').innerText = balance;
            } else {
                document.getElementById('result').innerText = "Повезет в следующий раз!";
            }
        }
    </script>
</body>
</html>
